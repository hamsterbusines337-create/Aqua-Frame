name: Aqua Frame browser integration
on:
  push:
    branches: [codex/aqua-screenshot]
    paths: ['.github/workflows/windows-browser-check.yml', 'diagnostics/browser-integration.ps1', 'diagnostics/browser-fixture.py']
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download tested build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 45894222524 --repo "${{ github.repository }}" --interval 12 --exit-status
          if ($LASTEXITCODE -ne 0) { throw 'The Windows build failed.' }
          gh run download 45894222524 --repo "${{ github.repository }}" --name AquaFrame-Runtime-x64 --dir runtime
          if ($LASTEXITCODE -ne 0) { throw 'Could not download runtime.' }
          icacls runtime /grant '*S-1-15-2-2:(OI)(CI)(RX)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not set sandbox ACLs.' }
      - name: Verify F11 from the address bar and the Chromium page
        shell: pwsh
        run: ./diagnostics/browser-window.ps1
      - name: Verify browser features against the local site
        shell: pwsh
        run: ./diagnostics/browser-integration.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Aqua-Browser-Test
          path: browser-*.png
          if-no-files-found: ignore
