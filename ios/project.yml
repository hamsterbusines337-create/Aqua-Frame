name: AquaFrame
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AquaFrame:
    type: application
    platform: iOS
    sources: [AquaFrame]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aquaframe.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aqua Frame
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AquaFrameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AquaFrameUITests]
    dependencies:
      - target: AquaFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aquaframe.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AquaFrame
schemes:
  AquaFrame:
    build:
      targets:
        AquaFrame: all
        AquaFrameUITests: [test]
    test:
      targets: [AquaFrameUITests]
